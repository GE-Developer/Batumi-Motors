  <header class="head">
    <div class="shell head__row">

      <a class="logo" href="{url-home}">
        <span>{brand-1}</span><span class="logo__accent">{brand-2}</span>
      </a>

      <!-- The burger is visible only on a narrow screen. On a wide one CSS
           hides it, and the panel below unfolds back into the header row. -->
      <button class="burger" type="button" aria-label="{nav-label}"
              aria-expanded="false" aria-controls="head-menu">
        <span class="burger__bar"></span>
        <span class="burger__bar"></span>
        <span class="burger__bar"></span>
      </button>

      <!-- On a wide screen the .head__menu and .head__tools wrappers get
           display: contents and vanish from the layout: sections, languages and
           theme stand straight in the header grid, as if the wrappers were not
           there. On a narrow screen this is a drop-down panel under the burger. -->
      <div class="head__menu" id="head-menu">

        <!-- The cross is visible only in the opened drawer: on a wide screen
             the wrapper dissolves and the button has no business there. -->
        <button class="drawer-close" type="button" aria-label="{close}"></button>

        <nav class="nav" aria-label="{nav-label}">
          <a class="nav__link" href="{url-cars}">{nav-cars}</a>
          <a class="nav__link" href="{url-deals}">{nav-deals}</a>
          <a class="nav__link" href="{url-terms}">{nav-terms}</a>
          <a class="nav__link" href="{url-about}">{nav-about}</a>
        </nav>

        <div class="head__tools">
          <nav class="lang" aria-label="{lang-label}">
            <a class="lang__link" href="{url-ru}" hreflang="ru" lang="ru">RU</a>
            <a class="lang__link" href="{url-en}" hreflang="en" lang="en">EN</a>
            <a class="lang__link" href="{url-ka}" hreflang="ka" lang="ka">KA</a>
          </nav>

          <button class="theme" type="button" aria-label="{theme-label}">
            <svg class="theme__sun" width="16" height="16" viewBox="0 0 16 16" fill="none"
                 stroke="currentColor" stroke-width="1.2" aria-hidden="true">
              <circle cx="8" cy="8" r="3.4"></circle>
              <path d="M8 .9v1.9M8 13.2v1.9M.9 8h1.9M13.2 8h1.9M3.1 3.1l1.35 1.35M11.55 11.55L12.9 12.9M12.9 3.1l-1.35 1.35M4.45 11.55L3.1 12.9"></path>
            </svg>
            <svg class="theme__moon" width="16" height="16" viewBox="0 0 16 16" fill="none"
                 stroke="currentColor" stroke-width="1.2" aria-hidden="true">
              <circle cx="8" cy="8" r="5"></circle>
              <path d="M8 3a5 5 0 000 10z" fill="currentColor" stroke="none"></path>
            </svg>
          </button>
        </div>

      </div>

      <a class="btn head__cta" href="https://wa.me/{whatsapp}" rel="noopener">{cta}</a>

    </div>
  </header>
