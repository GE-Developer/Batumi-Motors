  <footer class="foot">
    <div class="shell foot__grid">

      <div>
        <a class="logo" href="{url-home}">
          <span>{brand-1}</span><span class="logo__accent">{brand-2}</span>
        </a>
        <p class="small muted foot__tag">{tagline}</p>
        <p class="small muted foot__hours">{hours}</p>
      </div>

      <div>
        <h2 class="foot__title">{footer-contacts}</h2>
        <ul class="foot__list">
          <li><a class="foot__link" href="tel:{phone-link}">{phone}</a></li>
          <li><a class="foot__link" href="https://wa.me/{whatsapp}" rel="noopener">WhatsApp</a></li>
          <li><a class="foot__link" href="https://instagram.com/{instagram}" rel="noopener">Instagram</a></li>
        </ul>
      </div>

    </div>

    <div class="shell foot__bottom">
      <p class="small muted">{copyright}</p>
      <p class="small muted foot__made">{made-by}
        <a class="foot__link" href="{author-url}" rel="noopener">{author}</a></p>
    </div>
  </footer>
